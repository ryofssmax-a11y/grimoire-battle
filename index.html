<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>魔導書バトル</title><meta name="theme-color" content="#1a1022">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head><body>
<div id="app">
<!-- タイトル -->
<section id="s-title" class="screen active">
  <div class="title-wrap">
    <div class="logo-circle"></div>
    <h1>魔導書<span>バトル</span></h1>
    <p class="sub">本を撮れば、それは魔導書になる。</p>
    <div class="menu">
      <button class="btn big" data-go="capture">📷 撮影してカード化</button>
      <button class="btn" data-go="collection">📚 カード図鑑</button>
      <button class="btn" data-go="deck">🗂 デッキ編集</button>
      <button class="btn gold" data-go="levels">⚔ CPUとバトル</button>
      <button class="btn" data-go="records">🏆 戦績</button>
    </div>
    <p class="note">撮影した表紙はこの端末の中だけに保存され、どこにも送信されません。</p>
  </div>
</section>
<!-- 撮影 -->
<section id="s-capture" class="screen">
  <header><button class="back" data-go="title">‹</button><h2>撮影してカード化</h2></header>
  <div id="cap-camera" class="cap-step">
    <div class="viewfinder"><video id="video" playsinline muted autoplay></video><div class="vf-guide"></div><p id="cam-msg" class="cam-msg">本の表紙を枠に合わせてください</p></div>
    <div class="cap-btns"><label class="btn small file">🖼 写真を選ぶ<input id="file" type="file" accept="image/*" capture="environment" hidden></label><button id="shutter" class="shutter" aria-label="撮影"></button><span class="sp"></span></div>
  </div>
  <div id="cap-crop" class="cap-step hidden">
    <p class="hint" id="crop-hint">四隅をドラッグして表紙に合わせてください</p>
    <div class="crop-wrap"><canvas id="crop-canvas"></canvas></div>
    <div class="row"><button class="btn small" id="crop-retake">撮り直す</button><button class="btn small" id="crop-reset">全体</button><button class="btn small gold" id="crop-ok">この範囲で決定</button></div>
  </div>
  <div id="cap-title" class="cap-step hidden">
    <div class="title-step"><canvas id="cover-preview"></canvas>
      <div class="tform"><p id="ocr-status" class="ocr-status">文字を読み取り中…</p>
        <label>本のタイトル<input id="title-input" type="text" maxlength="40" placeholder="タイトルを入力"></label>
        <p class="hint small">読み取りが違うときは直してください</p>
        <button class="btn small" id="ocr-retry">もう一度読み取る</button></div></div>
    <div class="row"><button class="btn small" id="title-back">範囲を直す</button><button class="btn gold" id="summon-btn">✨ 召喚する</button></div>
  </div>
</section>
<!-- 図鑑 -->
<section id="s-collection" class="screen">
  <header><button class="back" data-go="title">‹</button><h2>カード図鑑</h2><span id="col-count" class="count"></span></header>
  <div class="filters" id="col-filters"></div>
  <div id="col-grid" class="grid"></div>
</section>
<!-- デッキ -->
<section id="s-deck" class="screen">
  <header><button class="back" data-go="title">‹</button><h2>デッキ編集</h2><span id="deck-count" class="count"></span></header>
  <p class="hint">タップで入れる／外す（20枚）。足りない分ははじまりの魔導書で自動補充します。</p>
  <div class="row"><button class="btn small" id="deck-auto">おまかせ</button><button class="btn small" id="deck-clear">すべて外す</button></div>
  <div id="deck-grid" class="grid"></div>
</section>
<!-- 強さ選択 -->
<section id="s-levels" class="screen">
  <header><button class="back" data-go="title">‹</button><h2>相手をえらぶ</h2></header>
  <div class="levels">
    <button class="lv" data-lv="1"><b>見習い魔導士</b><span>よわい：気まぐれに動く</span></button>
    <button class="lv" data-lv="2"><b>宮廷魔導士</b><span>ふつう：高いカードから出す</span></button>
    <button class="lv" data-lv="3"><b>大賢者</b><span>つよい：先を読み、とどめを逃さない</span></button>
  </div>
</section>
<!-- バトル -->
<section id="s-battle" class="screen">
  <div class="bt">
    <div class="hero enemy" id="hero1" data-target="hero"><div class="hp" id="hp1">20</div><div class="hinfo"><b id="name1">大賢者</b><span>手札 <i id="hand1">0</i>・山札 <i id="deck1">0</i></span></div><div class="mana" id="mana1"></div></div>
    <div class="board" id="board1"></div>
    <div class="mid"><span id="turn-label">あなたのターン</span><button id="menu-btn" class="tiny">≡</button></div>
    <div class="board" id="board0"></div>
    <div class="hero me" id="hero0"><div class="hp" id="hp0">20</div><div class="hinfo"><b>あなた</b><span>山札 <i id="deck0">0</i></span></div><div class="mana" id="mana0"></div><button id="end-btn" class="btn small gold">ターン終了</button></div>
    <div class="hand" id="hand0"></div>
    <p id="battle-hint" class="bhint">カードをタップして出す・使い魔をタップして攻撃</p>
  </div>
</section>
<!-- 結果 -->
<section id="s-result" class="screen">
  <div class="result"><h2 id="res-title">勝利！</h2><p id="res-sub"></p><div id="res-rec" class="rec"></div>
    <div class="menu"><button class="btn gold" id="res-again">もう一度</button><button class="btn" data-go="title">タイトルへ</button></div></div>
</section>
<!-- 戦績 -->
<section id="s-records" class="screen">
  <header><button class="back" data-go="title">‹</button><h2>戦績</h2></header>
  <div id="rec-body" class="rec"></div>
</section>
</div>
<div id="modal" class="modal hidden"><div class="modal-in" id="modal-in"></div></div>
<div id="summon" class="summon hidden"><canvas id="summon-canvas"></canvas><div id="summon-card"></div><div id="summon-label" class="slabel"></div><p class="stap">タップして閉じる</p></div>
<div id="toast" class="toast"></div>
<script src="js/statgen.js"></script><script src="js/rules.js"></script><script src="js/ai.js"></script><script src="js/starters.js"></script>
<script src="js/db.js"></script><script src="js/capture.js"></script><script src="js/cardview.js"></script><script src="js/summon.js"></script><script src="js/app.js"></script>
</body></html>
